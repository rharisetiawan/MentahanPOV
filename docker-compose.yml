services:
  # Local Bot API Server — see README -> "Telegram bot" -> "Removing the
  # 20MB download cap". Runs alongside the bot so raw phone footage isn't
  # capped by api.telegram.org's 20MB limit.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  mentahanpov-bot:
    build: .
    # Named explicitly so `dashboard` below can reuse this exact image
    # instead of building its own — same Dockerfile, same context, same
    # code, only the command differs. Building it twice used to produce
    # two full copies of the unpacked image (ffmpeg + playwright + all of
    # requirements.txt), which is what ran this box's small /www
    # partition out of space. One build now serves both.
    image: mentahanpov-app:latest
    restart: unless-stopped
    # This box's IPv6 route is broken (has AAAA records, no actual path —
    # connects fail with "Network is unreachable"), which intermittently
    # took down Gemini/Drive/Graph API calls depending on which address
    # family got picked. Disabling IPv6 in the container forces IPv4,
    # which works. See DEPLOYMENT.md for the full incident writeup.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
    volumes:
      - ./credentials:/app/credentials
      - ./state:/app/state
      - ./incoming:/app/incoming
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  # Read-only status page — see core/health.py + DEPLOYMENT.md. LAN-only:
  # bound to the host's own network, not forwarded to the internet.
  # Reachable at http://<box-ip>:${DASHBOARD_PORT:-8090} from any device
  # on the same WiFi.
  dashboard:
    image: mentahanpov-app:latest
    command: python dashboard.py
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-8090}:${DASHBOARD_PORT:-8090}"
    volumes:
      - ./credentials:/app/credentials:ro
      - ./state:/app/state:ro

volumes:
  telegram-bot-api-data:
