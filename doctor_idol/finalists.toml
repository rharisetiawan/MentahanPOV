# Doctor Idol Competition Season IV — fancam MentahanPOV (unofficial).
# Direkam 6 Nov 2026 (Jawa Pos Health & Lifestyle Expo 2026), 15 finalis.
#
# Satu blok [[finalist]] per video. Video mentahnya ada di
# media/doctor-idol-s4/raw/<slug>.mp4 (folder utama, tidak masuk git).
# Cara kerja lengkap: doctor_idol/README.md
#
#   slug       nama file video tanpa .mp4; finalis-NN = urutan tampil di panggung
#   episode    nomor seri "POV Kursi Penonton #n" (urutan posting, bukan urutan tampil)
#   name       persis seperti di layar panggung. "(?)" = ejaan dari suara MC, BELUM PASTI:
#              cek dulu sebelum posting (tanda ini ikut tampil di video supaya tidak lolos)
#   segments   potongan [mulai, selesai] dalam detik, urut; disambung crossfade
#   instagram  tanpa @; kosong = placeholder di caption
#   status     draft | approved | posted
#   kind       "announcement" untuk reel pengumuman juara (pakai hook + card sendiri)

[settings]
season = "Season IV"
event = "Doctor Idol Competition"
series = "POV Kursi Penonton"   # nama seri: pill di cover, baris 2 caption, judul Shorts
transition_s = 0.3      # crossfade antar potongan
# Ciri khas MentahanPOV di setiap reel (kosongkan teks / false untuk mematikan):
hook_text = "POV: kamu di kursi penonton"   # pill tengah, 0 s sampai hook_s
hook_s = 2.5
name_card = true        # kartu kiri: nama · kota, lagu · penyanyi (setelah hook)
name_card_s = 4.0
score_text = "Skor kamu berapa? 1-10"       # pill tengah di detik-detik terakhir
verdict_text = "Setuju sama juri?"          # penutup reel pengumuman juara
score_s = 4.0
progress_bar = true     # garis ungu brand di tepi atas, terisi sampai video selesai
logo_width_px = 216     # logo POV pojok kanan atas
logo_opacity = 0.92
target_clip_s = 30.0    # panjang usulan `suggest`

# Potongan dipilih dari timeline tiap 5 detik: bagian close-up + klimaks lagu, menghindari
# saat kamera berpaling. Nama kamera asli ada di notes.

